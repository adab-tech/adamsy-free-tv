# fly.toml app configuration file generated for adamsy-free-tv-t-ejna on 2026-07-07T09:24:42Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'adamsy-free-tv-t-ejna'
primary_region = 'ams'

[build]

[env]
  PORT = '8080'
  ADAMSY_REQUIRE_ADMIN_TOKEN = '1'

[http_service]
  # Must match Dockerfile ENV PORT / uvicorn --port / EXPOSE.
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '15s'
    method = 'GET'
    timeout = '5s'
    path = '/health'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
